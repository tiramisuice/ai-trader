app = "ai-trader-web"
primary_region = "sjc"

[build]
  [build.args]
    NEXT_PUBLIC_API_URL = "https://ai-trader-api.fly.dev"

[env]
  PORT = "3000"
  NEXT_PUBLIC_API_URL = "https://ai-trader-api.fly.dev"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
